<div *ngIf="!cargando && lineChartData.labels.length">
    <div style="display: block; width: 100%; position: relative; height: 350px;">
        <canvas class="w-100" baseChart [data]="lineChartData" [options]="lineChartOptions"
            (chartHover)="chartHovered($event)" (chartClick)="chartClicked($event)">
        </canvas>
    </div>
</div>

<div *ngIf="!cargando && !lineChartData.labels.length" class="mt-5">
    <plex-label class="flex-column" icon="signos-vitales" type="info" justify="center" size="xl"
                direction="column" titulo="Sin registros de {{ labels }}"
                subtitulo="{{ enRango ? 'No hay valores en el rango de fechas seleccionado' : 'El paciente no tiene valores registrados para este signo vital' }}">
    </plex-label>
</div>
