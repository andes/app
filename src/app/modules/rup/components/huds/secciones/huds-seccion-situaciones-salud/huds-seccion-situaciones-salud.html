<plex-title titulo="Situaciones de Salud Activas" size="sm"></plex-title>

<plex-text [(ngModel)]="diagnosticoProfesional" class="mb-2"
           placeholder="Busque un diagnóstico o profesional de la salud"></plex-text>
<br>
<ng-container *ngIf="trastornosFiltrados.length">
    <plex-accordion>
        <plex-panel *ngFor="let trastorno of trastornosFiltrados" [active]="trastornoExpandido === trastorno"
                    (toggle)="toggleAcordeon(trastorno, $event)">
            <div plex-accordion-title class="d-flex justify-content-between align-items-center">
                <plex-label titulo="{{ getTitulo(trastorno) }}" subtitulo="{{ getSubtitulo(trastorno) }}">
                </plex-label>
                <plex-label titulo="Profesional" subtitulo="{{ getProfesionalTexto(trastorno) }}"></plex-label>
                <section class="d-flex align-items-center">
                    <plex-badge *ngIf="esEmbarazo(trastorno)" type="info" class="mr-2">Embarazo en curso</plex-badge>
                    <plex-badge *ngIf="!esEmbarazo(trastorno) && trastorno.evoluciones?.length" type="success"
                                class="mr-2">{{ trastorno.evoluciones[0].estado }}</plex-badge>
                    <plex-badge *ngIf="!esEmbarazo(trastorno) && trastorno.evoluciones?.length" type="info"
                                class="mr-2">{{ trastorno.evoluciones[0].fechaCarga | fecha }}</plex-badge>
                    <plex-badge *ngIf="!esEmbarazo(trastorno) && !trastorno.evoluciones?.length" type="info"
                                class="mr-2">Sin evoluciones</plex-badge>
                    <plex-button icon="eye" type="info" size="sm" class="mr-1" tooltip="Ver prestación"
                                 (click)="$event.stopPropagation(); verPrestacion(trastorno)"></plex-button>
                    <plex-button icon="{{ trastornoExpandido === trastorno ? 'chevron-up' : 'chevron-down' }}"
                                 type="info" size="sm"></plex-button>
                </section>
            </div>
            <div *ngIf="esEmbarazo(trastorno)" class="mt-2">
                <plex-grid cols="2" size="md" type="full">
                    <plex-label titulo="Fecha último control"
                                subtitulo="{{ (trastorno.fechaUltimoControl | fecha) || 'Sin datos' }}">
                    </plex-label>
                    <plex-label titulo="Fecha probable de parto"
                                subtitulo="{{ (trastorno.fechaProbableDeParto | fecha) || 'Sin datos' }}">
                    </plex-label>
                </plex-grid>
            </div>
            <ng-container *ngIf="!esEmbarazo(trastorno)">
                <div *ngIf="trastorno.evoluciones?.[0]?.evolucion else sinEvolucion">
                    <h6><strong>Detalles de la evolución: </strong></h6>
                    {{ trastorno.evoluciones[0].evolucion }}
                </div>
                <ng-template #sinEvolucion>
                    <div>
                        <h6><strong>Sin evoluciones </strong></h6>
                    </div>
                </ng-template>
            </ng-container>
        </plex-panel>
    </plex-accordion>
</ng-container>
<div *ngIf="trastornos.length && !trastornosFiltrados.length" class="mt-5">
    <plex-label class="flex-column" icon="trastorno" type="info" justify="center" size="xl" direction="column"
                titulo="No se encontraron situaciones de salud para el filtro aplicado">
    </plex-label>
</div>
<div *ngIf="!trastornos.length" class="mt-5">
    <plex-label class="flex-column" icon="trastorno" type="info" justify="center" size="xl" direction="column"
                titulo="El paciente no tiene situaciones de salud activas">
    </plex-label>
</div>
