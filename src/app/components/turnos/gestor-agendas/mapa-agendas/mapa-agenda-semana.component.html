<div class="semana mt-1"
     [style.grid-template-columns]="'50px repeat(' + semana.length + ', minmax(0, 1fr))'"
     [style.grid-template-rows]="'auto repeat(' + filas.length + ', 40px)'">
    <div class="first" style="grid-column: 1; grid-row: 1"></div>
    <div class="dia" *ngFor="let dia of semana; let d = index" [style.grid-column]="d + 2" [style.grid-row]="1">
        <span class="font-weight-bold text-uppercase">{{dia.nombre}} </span>
        <span>{{dia.fecha | date:"dd/MM"}}</span>
    </div>

    <ng-container *ngFor="let fila of filas; let i = index">
        <div *ngIf="i % 2 === 0" class="hora" style="grid-column: 1" [style.grid-row]="(i + 2) + ' / span 2'">
            <span class="font-weight-bold text-uppercase">{{fila.hora}}:00</span>
        </div>
        <div *ngFor="let dia of semana; let d = index" class="slot" [class.punteado]="i % 2 === 1"
             [style.grid-column]="d + 2" [style.grid-row]="i + 2">
        </div>
    </ng-container>

    <ng-container *ngFor="let dia of semana; let d = index">
        <div *ngFor="let celda of dia.turnos" class="paciente" [style.grid-column]="d + 2"
             [style.grid-row]="(celda.slot + 2) + ' / span ' + celda.rowspan" [style.width]="celda.ancho"
             [style.margin-left]="celda.offset" [style.background]="celda.color" [attr.title]="celda.titulo"
             (click)="detalleDia(celda)">
            {{celda.iniciales}}
        </div>
    </ng-container>
</div>
