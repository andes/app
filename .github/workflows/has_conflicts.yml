name: Label merge conflicts

# pull_request_target corre en el repo base: el token puede etiquetar.
# push a master re-chequea los PRs abiertos cuando avanza la base.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  conflicts:
    uses: andes/shared-workflows/.github/workflows/label-merge-conflicts.yml@v1
    with:
      label: has_conflicts
