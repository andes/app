name: BUILD AND TEST

on: [push]

permissions:
  contents: read

jobs:
  build:
    uses: andes/shared-workflows/.github/workflows/node-ci.yml@feat/node-ci-cache
    with:
      runner: ubuntu-22.04
      node-version: "18"
      cache: npm
      commands: |
        cp ./src/environments/apiKeyMaps.ts.example ./src/environments/apiKeyMaps.ts
        npm run lint
        rm .browserslistrc && touch .browserslistrc
        # Compilar shared de forma independiente para detectar dependencias
        # incorrectas hacia archivos de la aplicación.
        npx ng build shared
        # Validar el paquete antes del build de ANDES, que limpia dist/.
        test -f dist/shared/package.json
        test -f dist/shared/CHANGELOG.md
        test -f dist/shared/MIGRATION.md
        npm pack ./dist/shared --dry-run
        npm run build:prod -- --progress=false
