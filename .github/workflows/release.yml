name: RELEASE

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 3'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: andes/shared-workflows/.github/workflows/semantic-release.yml@v1
    secrets:
      release_token: ${{ secrets.DEPLOY_TOKEN }}
    with:
      branches: "['master']"
      skip_npm: false
